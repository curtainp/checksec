[package]
name = "checksec"
version = "0.1.0"
authors = ["curtainp"]
licese = "MIT"
description = "A fast, simple checksec tool."
keywords = ["pwn", "security"]
edition = "2024"

[profile.release]
lto = true
strip = true
panic = 'abort'

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.8", features = ["derive"] }
colored = "3.1.1"
goblin = "0.10.7"
memmap2 = "0.9.12"
